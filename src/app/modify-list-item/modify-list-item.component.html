<form [formGroup]="laptopForm" (ngSubmit)="onAdd()">
  <div class="form-group">
    <label for="serialNumber">Serial Number</label>
    <input type="text" id="serialNumber" formControlName="serialNumber" [appHighlightOnFocus]="'lightgreen'" />
  </div>

  <div class="form-group">
    <label for="brand">Brand</label>
    <input type="text" id="brand" formControlName="brand" [appHighlightOnFocus]="'lightyellow'" />
  </div>

  <div class="form-group">
    <label for="storage">Storage</label>
    <input type="text" id="storage" formControlName="storage" appHighlightOnFocus />
  </div>

  <div class="form-group">
    <label for="isAvailable">Available</label>
    <input type="checkbox" id="isAvailable" formControlName="isAvailable" />
  </div>

  <button type="submit">Add</button>
  <button type="button" (click)="onUpdate()">Update</button>
  <button type="button" (click)="navigateToLaptopList()">Back to List</button>
  <button type="submit">Submit</button>

</form>
